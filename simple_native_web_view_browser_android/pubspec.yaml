name: simple_native_web_view_browser_android
description: "Android implementation of simple_native_web_view_browser"
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  simple_native_web_view_browser:
    path: ../simple_native_web_view_browser

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: simple_native_web_view_browser
    platforms:
      android:
        package: ru.example.simple_native_web_view_browser
        pluginClass: SimpleNativeWebViewBrowserPlugin
        dartPluginClass: SimpleNativeWebViewBrowserAndroid
