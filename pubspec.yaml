name: simple_native_web_view_browser
description: "Простой полноэкранный нативный браузер на основе WebView"
version: 0.5.0
homepage: https://github.com/npu3pak/flutter-simple-native-web-view-browser
repository: https://github.com/npu3pak/flutter-simple-native-web-view-browser
topics:
  - webview
  - browser
  - native

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: ru.example.simple_native_web_view_browser
        pluginClass: SimpleNativeWebViewBrowserPlugin
      ios:
        pluginClass: SimpleNativeWebViewBrowserPlugin
